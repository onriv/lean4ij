# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = lean4ij
pluginName = lean4ij
pluginRepositoryUrl = https://github.com/onriv/lean4ij
# SemVer format -> https://semver.org
# TODO add sha1 to the beta output
pluginVersion = 0.2.9

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# For the dependence on textmate bundle api, the plugin must start build from 241
# even removed textmate, we still required other api...
pluginSinceBuild = 242
#pluginUntilBuild = 252

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
# TODO it seems the tests failed in IU 2024.2
# platformType = PC
platformType = IU
# It seems no IC from 2025.3?
# It may make the runVerifier failed
# platformType = IC

# TODO AI does not work with version 2024.1 yet:
#      Cannot resolve Android Studio with provided version: 2024.1
# platformType = AI

# platformType = RR
# platformType = CL

# Latest released platform at the time of writing. Nightly/EAP builds (e.g. 271.*) are not in the JetBrains
# artifact repository; to compile against an installed IDE instead, set `platformLocalPath` (see below).
platformVersion = 2026.2.3

# Optional: absolute path to a locally installed IDE (on macOS: `/Applications/IntelliJ IDEA.app/Contents`).
# When non-empty it is used instead of platformType/platformVersion. Prefer setting it in
# ~/.gradle/gradle.properties or on the command line (-PplatformLocalPath=...) rather than committing it here.
platformLocalPath =

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.jetbrains.php:203.4449.22, org.intellij.scala:2023.3.27@EAP
platformPlugins =
# Example: platformBundledPlugins = com.intellij.java
platformBundledPlugins =
# Example: platformBundledModules = intellij.spellchecker
# Modules that are no longer reachable through com.intellij.modules.platform at compile time on 2026.x+ IDEs
# (run configurations, build tool window, external system auto-import and JCEF). Comma separated, no spaces.
platformBundledModules = intellij.platform.buildView,intellij.platform.execution,intellij.platform.execution.impl,intellij.platform.externalSystem,intellij.platform.externalSystem.impl,intellij.platform.ui.jcef,intellij.libraries.jcef

# Gradle Releases -> https://github.com/gradle/gradle/releases
# TODO gradle/wrapper/gradle.properties also hardcode the version
gradleVersion = 9.3.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
# org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# Compiling against 2026.x+ platforms needs more heap than the defaults, otherwise the Kotlin compile daemon dies
# with "OutOfMemoryError: GC overhead limit exceeded".
org.gradle.jvmargs = -Xmx3g -XX:+UseParallelGC
kotlin.daemon.jvmargs = -Xmx3g

systemProp.https.protocols=TLSv1.2,TLSv1.1,TLSv1
systemProp.http.protocols=TLSv1.2,TLSv1.1,TLSv1
